<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Zennou</title>
<meta name="description" content="Log in to your Zennou account.">
<link rel="icon" href="assets/Zennou_Logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --void: #0a0a0a;
    --zinc-950: #0c0c0d;
    --zinc-900: #141415;
    --zinc-800: #1f1f21;
    --zinc-700: #38383c;
    --zinc-600: #5a5a60;
    --zinc-500: #86868c;
    --zinc-400: #adadb3;
    --zinc-300: #cfcfd3;
    --zinc-200: #e6e6e8;
    --white: #ffffff;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: hidden; width: 100%; }

  body {
    background: var(--black);
    color: var(--zinc-300);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
  }

  h1, h2 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--white); color: var(--black); }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 10%, transparent 70%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 5px;
  }

  .auth-card {
    width: 100%;
    max-width: 640px;
    padding: 40px 20px;
  }

  .auth-head { text-align: center; margin-bottom: 32px; }
  .auth-head h1 { font-size: 24px; font-weight: 600; color: var(--white); margin-bottom: 8px; }
  .auth-head p { font-size: 14px; color: var(--zinc-500); }
  .auth-head p a { color: var(--zinc-300); text-decoration: underline; text-underline-offset: 2px; }
  .auth-head p a:hover { color: var(--white); }

  .field-group { margin-bottom: 20px; }

  .field-label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--zinc-400);
    letter-spacing: 0.02em;
  }

  .forgot-link {
    font-size: 12.5px;
    color: var(--zinc-500);
  }
  .forgot-link:hover { color: var(--zinc-200); }

  input {
    width: 100%;
    background: var(--zinc-900);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--zinc-200);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--zinc-400);
    background: var(--zinc-800);
  }

  input::placeholder { color: var(--zinc-600); }

  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--zinc-500);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    padding: 4px 6px;
  }
  .pw-toggle:hover { color: var(--zinc-200); }

  .btn-solid {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    font-size: 14.5px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    background: var(--white);
    color: var(--black);
    border: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    margin-top: 6px;
  }
  .btn-solid:hover { background: var(--zinc-200); transform: translateY(-1px); }
  .btn-solid:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 28px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .divider span {
    font-size: 11.5px;
    color: var(--zinc-600);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }

  .oauth-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--zinc-300);
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 10px;
  }
  .oauth-btn:hover { border-color: var(--zinc-500); background: rgba(255,255,255,0.03); color: var(--white); }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--zinc-600);
    margin-top: 32px;
  }
  .back-home:hover { color: var(--zinc-300); }

  .field-error {
    font-size: 12.5px;
    color: var(--zinc-300);
    margin-top: 6px;
    display: none;
  }
  .field-error.show { display: block; }
  input.invalid { border-color: var(--zinc-400); }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (max-width: 480px) {
    .auth-card { padding: 32px 24px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="page">
  <div class="auth-card">
    <div class="auth-head">
      <h1>Welcome back</h1>
      <p>New to Zennou? <a href="register.html">Create an account</a></p>
    </div>

    <button type="button" class="oauth-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.3 12.3 0 01-1.873.892.076.076 0 00-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 00.084.028 19.84 19.84 0 006.002-3.03.077.077 0 00.032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Continue with Discord
    </button>

    <button type="button" class="oauth-btn">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#e6e6e8" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#adadb3" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#cfcfd3" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider"><span>OR</span></div>

    <form id="login-form" onsubmit="return handleLogin(event)" novalidate>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <div class="field-error" id="email-error">Enter a valid email address.</div>
      </div>

      <div class="field-group">
        <div class="field-label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <button type="button" class="pw-toggle" onclick="togglePw()" id="pw-toggle-btn">SHOW</button>
        </div>
        <div class="field-error" id="password-error">Enter your password.</div>
      </div>

      <button type="submit" class="btn-solid" id="submit-btn">Log In</button>
    </form>
  </div>
</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const btn = document.getElementById('pw-toggle-btn');
    if (pw.type === 'password') {
      pw.type = 'text';
      btn.textContent = 'HIDE';
    } else {
      pw.type = 'password';
      btn.textContent = 'SHOW';
    }
  }

  function handleLogin(e) {
    e.preventDefault();

    const email = document.getElementById('email');
    const password = document.getElementById('password');
    let valid = true;

    document.getElementById('email-error').classList.remove('show');
    document.getElementById('password-error').classList.remove('show');
    [email, password].forEach(f => f.classList.remove('invalid'));

    if (!email.checkValidity()) {
      document.getElementById('email-error').classList.add('show');
      email.classList.add('invalid');
      valid = false;
    }
    if (!password.checkValidity()) {
      document.getElementById('password-error').classList.add('show');
      password.classList.add('invalid');
      valid = false;
    }

    if (!valid) return false;

    // Placeholder — wire this up to your actual auth backend (e.g. Supabase Auth) later.
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    setTimeout(() => {
      btn.textContent = 'Welcome back ✓';
    }, 700);

    return false;
  }
</script>

</body>
</html>
