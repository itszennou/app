<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Zennou</title>
<meta name="description" content="This page doesn't exist on Zennou.">
<link rel="icon" href="assets/Zennou_Logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --void: #0a0a0a;
    --zinc-950: #0c0c0d;
    --zinc-900: #141415;
    --zinc-800: #1f1f21;
    --zinc-700: #38383c;
    --zinc-600: #5a5a60;
    --zinc-500: #86868c;
    --zinc-400: #adadb3;
    --zinc-300: #cfcfd3;
    --zinc-200: #e6e6e8;
    --white: #ffffff;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: hidden; width: 100%; }

  body {
    background: var(--black);
    color: var(--zinc-300);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
  }

  h1, h2 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.02em; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--white); color: var(--black); }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, black 10%, transparent 70%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .code-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(80px, 18vw, 160px);
    font-weight: 700;
    line-height: 1;
    color: var(--white);
    letter-spacing: -0.03em;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .page h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    margin: 20px 0 12px;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
  }

  .page p.desc {
    color: var(--zinc-500);
    font-size: 15px;
    max-width: 420px;
    margin: 0 auto 40px;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* diff strip — signature element, consistent with site motif */
  .diff-strip {
    width: 100%;
    max-width: 460px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255,255,255,0.015);
    backdrop-filter: blur(10px);
    overflow: hidden;
    text-align: left;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  .diff-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--zinc-500);
  }
  .diff-header .dots { display: flex; gap: 6px; margin-right: 6px; }
  .diff-header .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--zinc-700); }

  .diff-body {
    padding: 18px 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 2;
    overflow-x: auto;
  }
  .diff-line { display: flex; gap: 14px; align-items: flex-start; word-break: break-word; }
  .diff-line .sign { width: 14px; flex-shrink: 0; opacity: 0.8; }
  .diff-line.minus { color: var(--zinc-600); }
  .diff-line.minus .sign { color: var(--zinc-600); }
  .diff-line.plus { color: var(--zinc-200); }
  .diff-line.plus .sign { color: var(--white); }
  .diff-line.plus .highlight { background: rgba(255,255,255,0.08); padding: 0 4px; border-radius: 3px; }

  @media (max-width: 480px) {
    .diff-body { font-size: 10.5px; padding: 16px; }
    .diff-line { gap: 8px; }
  }

  .actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    font-size: 14.5px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
  }
  .btn-ghost { color: var(--zinc-300); border-color: var(--line-strong); }
  .btn-ghost:hover { color: var(--white); border-color: var(--zinc-500); background: rgba(255,255,255,0.03); }
  .btn-solid { background: var(--white); color: var(--black); font-weight: 600; }
  .btn-solid:hover { background: var(--zinc-200); transform: translateY(-1px); }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="page">
  <div class="code-num">404</div>
  <h1>This page doesn't exist.</h1>
  <p class="desc">The project, path, or link you're looking for may have been moved, renamed, or never published.</p>

  <div class="diff-strip">
    <div class="diff-header">
      <div class="dots"><span></span><span></span><span></span></div>
      request.diff
    </div>
    <div class="diff-body">
      <div class="diff-line minus"><span class="sign">−</span> route.status = "found"</div>
      <div class="diff-line minus"><span class="sign">−</span> path = "/requested-page"</div>
      <div class="diff-line plus"><span class="sign">+</span> <span class="highlight">route.status = "404_not_found"</span></div>
      <div class="diff-line plus"><span class="sign">+</span> <span class="highlight">suggestion = "go_home"</span></div>
    </div>
  </div>

  <div class="actions">
    <a href="index.html" class="btn btn-solid">Back to Home</a>
    <a href="contact.html" class="btn btn-ghost">Report a Problem</a>
  </div>
</div>

</body>
</html>
